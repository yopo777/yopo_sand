<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンドピクチャー</title>
<style>
  :root { --liquid1:#f4efe6; --liquid2:#d9d2c4; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #3a3a40, #16161a 70%);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif; color:#eee; gap:18px; padding:16px;
  }
  h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:.15em; color:#d8cbb0; }
  .stage { position:relative; width:min(78vmin,560px); aspect-ratio:1/1.12; }
  .rot { position:absolute; left:0; top:0; width:100%; aspect-ratio:1; cursor:pointer;
         transition:transform .9s cubic-bezier(.6,.05,.3,1); }
  .rot.noanim { transition:none; }
  .glass { position:absolute; inset:5%; border-radius:50%; overflow:hidden;
           background:radial-gradient(circle at 40% 35%, var(--liquid1), var(--liquid2)); }
  canvas { width:100%; height:100%; display:block; image-rendering:auto; }
  .shine { position:absolute; inset:5%; border-radius:50%; pointer-events:none;
           background:linear-gradient(135deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 35%, rgba(255,255,255,0) 70%, rgba(255,255,255,.08) 100%); }
  .ring { position:absolute; inset:2.5%; border-radius:50%; pointer-events:none;
          border:min(2.6vmin,18px) solid #111; box-shadow:0 0 0 2px #333 inset, 0 8px 24px rgba(0,0,0,.6), 0 0 0 1px #444; }
  .stand { position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:52%; height:13%;
           background:linear-gradient(#1b1b1b,#070707); clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);
           box-shadow:0 10px 20px rgba(0,0,0,.5); }
  .panel { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:center; max-width:620px; font-size:14px; }
  button, select { font:inherit; background:#2b2b31; color:#eee; border:1px solid #555; border-radius:8px; padding:7px 14px; cursor:pointer; }
  button:hover, select:hover { border-color:#c9a86a; }
  button.main { background:#c9a86a; color:#1a1408; border-color:#c9a86a; font-weight:700; }
  label { display:flex; align-items:center; gap:6px; }
  input[type=range] { width:100px; accent-color:#c9a86a; }
  .hint { font-size:12px; color:#999; }
</style>
</head>
<body>
<h1>SAND PICTURE</h1>
<div class="stage">
  <div class="rot" id="rot" title="クリックで裏返す">
    <div class="glass"><canvas id="cv"></canvas></div>
    <div class="shine"></div>
    <div class="ring"></div>
  </div>
  <div class="stand"></div>
</div>
<div class="panel">
  <button class="main" id="flipBtn">↻ 裏返す</button>
  <label>色 <select id="theme">
    <option value="gold">ゴールド</option>
    <option value="blue">ブルー</option>
    <option value="mono">モノクロ</option>
    <option value="purple">パープル</option>
    <option value="red">レッド</option>
  </select></label>
  <label>穴の数 <input type="range" id="holes" min="1" max="7" value="4"></label>
  <label>速さ <input type="range" id="speed" min="1" max="8" value="3"></label>
  <label><input type="checkbox" id="auto" checked> 自動で裏返す</label>
  <button id="resetBtn">作り直す</button>
</div>
<div class="hint">クリック / スペースキーで裏返し。毎回ちがう景色になります。</div>

<script>
(() => {
const N = 220, CX = N/2 - 0.5, CY = N/2 - 0.5, R = 107;
const EMPTY=0, WALL=1, SAND=2, BUB=3, OUT=4;
const T = new Uint8Array(N*N), C = new Uint8Array(N*N), J = new Uint8Array(N*N), M = new Uint32Array(N*N);
let stamp = 1;

const THEMES = {
  gold:   { liquid:['#f6f1e7','#ddd3c0'], cols:['#5a2e14','#8a4a22','#b8692f','#d98c4a','#e9b47a','#f3dcb8','#fbf6ee'] },
  blue:   { liquid:['#eef4f8','#cfdde8'], cols:['#0d1b3d','#1d3e7a','#2f6bb0','#5aa3d9','#9fd0ee','#dff0fa','#ffffff'] },
  mono:   { liquid:['#f2f2f0','#d4d4d0'], cols:['#0b0b0b','#2a2a2a','#4d4d4d','#7a7a7a','#a8a8a8','#d6d6d6','#fafafa'] },
  purple: { liquid:['#f4eff6','#dcd0e2'], cols:['#24103a','#4b2170','#7a3fa3','#a96ccc','#d0a6e3','#efdcf6','#ffffff'] },
  red:    { liquid:['#f7efec','#e2d0ca'], cols:['#3a0b0b','#6e1515','#a32424','#cc4b3a','#e38a74','#f3c8b8','#fff8f4'] },
};
let theme = THEMES.gold, pal = [], FALL = [], SLIDE = [];

const cv = document.getElementById('cv');
cv.width = N; cv.height = N;
const ctx = cv.getContext('2d');
const img = ctx.createImageData(N, N);
const rot = document.getElementById('rot');

const inCircle = (x,y) => (x-CX)**2 + (y-CY)**2 <= R*R;
const rnd = Math.random;

function hex(h){ return [1,3,5].map(i=>parseInt(h.substr(i,2),16)); }

function build(){
  theme = THEMES[document.getElementById('theme').value];
  pal = theme.cols.map(hex);
  // heavier (dark) grains sink faster; light grains slide farther -> natural strata
  FALL = pal.map((_,k)=>0.95 - 0.5*k/(pal.length-1));
  SLIDE = pal.map((_,k)=>0.3 + 0.6*k/(pal.length-1));
  document.documentElement.style.setProperty('--liquid1', theme.liquid[0]);
  document.documentElement.style.setProperty('--liquid2', theme.liquid[1]);
  const holes = +document.getElementById('holes').value;
  const d0 = N/2 - 1, d1 = N/2;

  // strata: random bands, warped horizontally
  const bands = []; let acc = 0, last = -1;
  while (acc < N*1.6) {
    let c; do { c = Math.floor(rnd()*pal.length); } while (c === last);
    // thin white/light accents, thicker dark bands
    const th = (c >= pal.length-2) ? 1 + rnd()*3 : 3 + rnd()*9;
    bands.push([acc+th, c]); acc += th; last = c;
  }
  const p1 = rnd()*6.28, p2 = rnd()*6.28, a1 = 4+rnd()*10, a2 = 1+rnd()*4, f1 = .02+rnd()*.04;
  const bandAt = v => { for (const [e,c] of bands) if (v < e) return c; return 0; };

  const airLine = CY - R + 12, sandLine = CY - R*0.62;
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const i = y*N+x;
    J[i] = rnd()*255;
    if (!inCircle(x,y)) { T[i]=OUT; continue; }
    if (y===d0 || y===d1) { T[i]=WALL; continue; }
    if (y < d0) {
      if (y < airLine) { T[i] = rnd()<0.85 ? BUB : EMPTY; }
      else if (y < sandLine) { T[i] = EMPTY; }
      else {
        T[i] = SAND;
        const w = a1*Math.sin(x*f1+p1) + a2*Math.sin(x*0.11+p2);
        C[i] = bandAt(y - sandLine + w + 20);
      }
    } else T[i] = EMPTY;
  }
  // holes in divider (symmetric-ish but jittered)
  const chord = Math.sqrt(R*R - (d0-CY)**2);
  for (let k=0;k<holes;k++){
    const t = (k+1)/(holes+1) + (rnd()-.5)*0.08;
    const hx = Math.round(CX - chord + 2*chord*t);
    for (const dx of [0,1]) for (const y of [d0,d1]) { const i=y*N+hx+dx; if (T[i]===WALL) T[i]=EMPTY; }
  }
  stillFrames = 0;
}

let moved = 0, sandMoved = 0;
function mv(a,b){ // move a->b (b must be empty)
  if (T[a]===SAND) sandMoved++;
  T[b]=T[a]; C[b]=C[a]; J[b]=J[a]; T[a]=EMPTY; M[b]=stamp; moved++;
}
function sw(a,b){
  const t=T[a],c=C[a],j=J[a]; T[a]=T[b];C[a]=C[b];J[a]=J[b]; T[b]=t;C[b]=c;J[b]=j; M[a]=M[b]=stamp; moved++;
}

function step(){
  stamp++;
  // sand: bottom-up
  for (let y=N-2;y>=0;y--){
    const rev = rnd()<.5;
    for (let k=0;k<N;k++){
      const x = rev ? N-1-k : k, i = y*N+x;
      if (T[i]!==SAND || M[i]===stamp) continue;
      if (rnd() > FALL[C[i]]) continue;          // slow sinking in liquid
      const b = i+N, tb = T[b];
      if (tb===EMPTY){
        // slight lateral drift while falling
        if (rnd()<0.06){ const d = rnd()<.5?-1:1; if (T[b+d]===EMPTY && T[i+d]===EMPTY){ mv(i,b+d); continue; } }
        mv(i,b); continue;
      }
      if (tb===BUB && rnd()<0.35){ sw(i,b); continue; }
      if (rnd()<SLIDE[C[i]]){
        const d = rnd()<.5?-1:1;
        if (T[b+d]===EMPTY && T[i+d]===EMPTY){ mv(i,b+d); continue; }
        if (T[b-d]===EMPTY && T[i-d]===EMPTY){ mv(i,b-d); continue; }
      }
      // buried grains are pushed sideways by the weight above -> bed sinks layer by layer (mass flow)
      if (y>1 && T[i-N]===SAND && T[i-2*N]===SAND){
        const d = rnd()<.5?-1:1;
        if (T[i+d]===EMPTY && T[i+d-N]!==SAND){ mv(i,i+d); continue; }
        if (T[i-d]===EMPTY && T[i-d-N]!==SAND){ mv(i,i-d); continue; }
      }
    }
  }
  // bubbles: top-down
  for (let y=1;y<N;y++){
    const rev = rnd()<.5;
    for (let k=0;k<N;k++){
      const x = rev ? N-1-k : k, i = y*N+x;
      if (T[i]!==BUB || M[i]===stamp) continue;
      const a = i-N, ta = T[a];
      if (ta===EMPTY && rnd()<0.9){ mv(i,a); continue; }
      if (ta===SAND && rnd()<0.12){ sw(i,a); continue; }
      const d = rnd()<.5?-1:1;
      if (T[a+d]===EMPTY && T[i+d]===EMPTY && rnd()<.6){ mv(i,a+d); continue; }
      if (T[i+d]===EMPTY && rnd()<.25){ mv(i,i+d); continue; }
    }
  }
}

function render(){
  const d = img.data;
  for (let i=0,p=0;i<N*N;i++,p+=4){
    const t = T[i];
    if (t===SAND){
      const c = pal[C[i]], s = 0.82 + J[i]/255*0.32;
      d[p]=Math.min(255,c[0]*s); d[p+1]=Math.min(255,c[1]*s); d[p+2]=Math.min(255,c[2]*s); d[p+3]=255;
    } else if (t===BUB){
      d[p]=d[p+1]=d[p+2]=250; d[p+3]=150 + (J[i]&63);
    } else if (t===WALL){
      d[p]=40; d[p+1]=40; d[p+2]=44; d[p+3]=170;
    } else d[p+3]=0;
  }
  ctx.putImageData(img,0,0);
}

let flipping = false, stillFrames = 0;
function flip(){
  if (flipping) return;
  flipping = true;
  rot.classList.remove('noanim');
  rot.style.transform = 'rotate(180deg)';
  setTimeout(() => {
    T.reverse(); C.reverse(); J.reverse(); M.fill(0);
    rot.classList.add('noanim');
    rot.style.transform = 'rotate(0deg)';
    render();
    void rot.offsetWidth;
    flipping = false; stillFrames = 0;
  }, 920);
}

function loop(){
  if (!flipping){
    moved = 0; sandMoved = 0;
    const sp = +document.getElementById('speed').value;
    for (let s=0;s<sp;s++) step();
    render();
    if (sandMoved < 3*sp) stillFrames++; else stillFrames = 0;
    if (document.getElementById('auto').checked && stillFrames > 180) flip();
  }
  requestAnimationFrame(loop);
}

rot.addEventListener('click', flip);
document.getElementById('flipBtn').addEventListener('click', flip);
document.getElementById('resetBtn').addEventListener('click', build);
document.getElementById('theme').addEventListener('change', build);
document.getElementById('holes').addEventListener('change', build);
addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); flip(); } });

build(); render(); loop();
})();
</script>
</body>
</html>
