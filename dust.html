<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>砂けむりシミュレーター</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#eee;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;}
  .ui{position:fixed;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;
      background:rgba(0,0,0,.35);padding:8px 10px;border-radius:10px;backdrop-filter:blur(4px);}
  button{font:inherit;background:#2a241c;color:#f0e2c8;border:1px solid #6b5a40;border-radius:7px;padding:5px 11px;cursor:pointer;}
  button.on{background:#d8b47a;color:#1d150a;border-color:#d8b47a;font-weight:700;}
  label{display:flex;gap:5px;align-items:center;}
  .hint{position:fixed;left:12px;bottom:10px;font-size:12px;color:rgba(255,240,220,.55);}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui">
  <button id="mWind" class="on">🌪 風でかき回す</button>
  <button id="mSand">⏳ 砂を落とす</button>
  <button id="gust">💨 突風</button>
  <label><input type="checkbox" id="auto" checked>上から流し続ける</label>
  <button id="reset">リセット</button>
</div>
<div class="hint">ドラッグで風を起こしたり、砂を落としたりできます</div>
<script>
(() => {
// ---------- canvas ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let CW, CH;                 // canvas size (px)
let W, H, cell;             // fluid grid size (cells) and cell size (px)
let SZ, u, v, u0, v0, d, d0, p, dv, curl;
const IX = (i,j) => i + (W+2)*j;

// ground heightfield (px from bottom), one column per GCOL px
const GCOL = 2;
let G, hgt;

// grains
let grains = [];
const MAXG = 9000;
const SAND = [[214,176,120],[190,148,96],[232,204,160],[160,118,74],[246,228,196]];

// offscreen for dust
const dc = document.createElement('canvas'), dctx = dc.getContext('2d');
let dimg;

// grain texture pattern for the ground
const tex = document.createElement('canvas'); tex.width = tex.height = 128;
{ const t = tex.getContext('2d'), im = t.createImageData(128,128);
  for (let k=0;k<im.data.length;k+=4){ const s = Math.random()*255; im.data[k]=im.data[k+1]=im.data[k+2]=s; im.data[k+3]=40; }
  t.putImageData(im,0,0); }
let texPat;

function init(){
  CW = cv.width = innerWidth; CH = cv.height = innerHeight;
  W = 160; cell = CW / W; H = Math.round(CH / cell);
  SZ = (W+2)*(H+2);
  [u,v,u0,v0,d,d0,p,dv,curl] = Array.from({length:9}, () => new Float32Array(SZ));
  G = Math.ceil(CW / GCOL); hgt = new Float32Array(G);
  for (let k=0;k<G;k++) hgt[k] = 18 + 6*Math.sin(k*0.02) + 4*Math.sin(k*0.057+1);
  grains = [];
  dc.width = W; dc.height = H; dimg = dctx.createImageData(W, H);
  texPat = ctx.createPattern(tex, 'repeat');
}

// ---------- Stable Fluids (Jos Stam) ----------
function setBnd(b, x){
  for (let i=1;i<=W;i++){
    x[IX(i,0)]   = b===2 ? -x[IX(i,1)] : x[IX(i,1)];
    x[IX(i,H+1)] = b===2 ? -x[IX(i,H)] : x[IX(i,H)];
  }
  for (let j=1;j<=H;j++){
    x[IX(0,j)]   = b===1 ? -x[IX(1,j)] : x[IX(1,j)];
    x[IX(W+1,j)] = b===1 ? -x[IX(W,j)] : x[IX(W,j)];
  }
  x[IX(0,0)] = .5*(x[IX(1,0)]+x[IX(0,1)]);
  x[IX(0,H+1)] = .5*(x[IX(1,H+1)]+x[IX(0,H)]);
  x[IX(W+1,0)] = .5*(x[IX(W,0)]+x[IX(W+1,1)]);
  x[IX(W+1,H+1)] = .5*(x[IX(W,H+1)]+x[IX(W+1,H)]);
}
function linSolve(b, x, x0, a, c, it){
  const ic = 1/c, s = W+2;
  for (let k=0;k<it;k++){
    for (let j=1;j<=H;j++){ let n = j*s+1;
      for (let i=1;i<=W;i++,n++) x[n] = (x0[n] + a*(x[n-1]+x[n+1]+x[n-s]+x[n+s]))*ic;
    }
    setBnd(b, x);
  }
}
function advect(b, dd, ds, uu, vv){
  for (let j=1;j<=H;j++) for (let i=1;i<=W;i++){
    const n = IX(i,j);
    let x = i - uu[n], y = j - vv[n];
    if (x<.5) x=.5; if (x>W+.5) x=W+.5; if (y<.5) y=.5; if (y>H+.5) y=H+.5;
    const i0=x|0, j0=y|0, s1=x-i0, t1=y-j0, s0=1-s1, t0=1-t1;
    dd[n] = s0*(t0*ds[IX(i0,j0)]+t1*ds[IX(i0,j0+1)]) + s1*(t0*ds[IX(i0+1,j0)]+t1*ds[IX(i0+1,j0+1)]);
  }
  setBnd(b, dd);
}
function project(){
  for (let j=1;j<=H;j++) for (let i=1;i<=W;i++){
    const n = IX(i,j);
    dv[n] = -.5*(u[n+1]-u[n-1]+v[n+W+2]-v[n-W-2]); p[n] = 0;
  }
  setBnd(0,dv); setBnd(0,p);
  linSolve(0, p, dv, 1, 4, 16);
  for (let j=1;j<=H;j++) for (let i=1;i<=W;i++){
    const n = IX(i,j);
    u[n] -= .5*(p[n+1]-p[n-1]); v[n] -= .5*(p[n+W+2]-p[n-W-2]);
  }
  setBnd(1,u); setBnd(2,v);
}
function vorticity(eps){
  for (let j=1;j<=H;j++) for (let i=1;i<=W;i++){
    const n = IX(i,j);
    curl[n] = .5*((v[n+1]-v[n-1]) - (u[n+W+2]-u[n-W-2]));
  }
  for (let j=2;j<H;j++) for (let i=2;i<W;i++){
    const n = IX(i,j);
    let nx = .5*(Math.abs(curl[n+1])-Math.abs(curl[n-1]));
    let ny = .5*(Math.abs(curl[n+W+2])-Math.abs(curl[n-W-2]));
    const len = Math.hypot(nx,ny) + 1e-5; nx/=len; ny/=len;
    u[n] += eps*ny*curl[n]; v[n] -= eps*nx*curl[n];
  }
}
// ground row for fluid column i (cells below are solid)
const groundRow = i => {
  const k = Math.min(G-1, Math.max(0, Math.floor((i-.5)*cell/GCOL)));
  return Math.floor((CH - hgt[k]) / cell) + 1;
};
function maskGround(){
  for (let i=1;i<=W;i++){
    for (let j=groundRow(i)+1;j<=H;j++){ const n=IX(i,j); u[n]=0; v[n]=0; d[n]*=0.5; }
  }
}
function fluidStep(){
  vorticity(0.12);
  for (let n=0;n<SZ;n++){
    v[n] += 0.0035*d[n];        // dust is heavier than air -> clouds slump and spread
    u[n] *= 0.996; v[n] *= 0.996;
  }
  u0.set(u); v0.set(v);
  advect(1, u, u0, u0, v0); advect(2, v, v0, u0, v0);
  maskGround(); project();
  d0.set(d); advect(0, d, d0, u, v);
  for (let n=0;n<SZ;n++) d[n] *= 0.993;
}
function sampleVel(px, py){
  const i = Math.min(W, Math.max(1, Math.round(px/cell + .5)));
  const j = Math.min(H, Math.max(1, Math.round(py/cell + .5)));
  return IX(i,j);
}

// ---------- grains ----------
function spawn(x, y, vx, vy, light){
  if (grains.length >= MAXG) return;
  grains.push({x, y, vx, vy, c: (Math.random()*SAND.length)|0, drag: light ? 0.12 : 0.025 + Math.random()*0.02});
}
function grainStep(){
  const g = 0.22;
  for (let k=grains.length-1;k>=0;k--){
    const q = grains[k];
    const n = sampleVel(q.x, q.y);
    const fu = u[n]*cell, fv = v[n]*cell;
    q.vx += (fu - q.vx)*q.drag;
    q.vy += g + (fv - q.vy)*q.drag;
    // falling grains drag the air with them (stream entrains air)
    u[n] += (q.vx/cell - u[n])*0.004; v[n] += (q.vy/cell - v[n])*0.004;
    q.x += q.vx; q.y += q.vy;
    if (q.x < 0 || q.x >= CW){ grains.splice(k,1); continue; }
    const col = Math.min(G-1, (q.x/GCOL)|0), gy = CH - hgt[col];
    if (q.y >= gy){
      // impact: deposit + dust puff + splash of air
      const sp = Math.hypot(q.vx, q.vy) / cell;
      hgt[col] += 0.55;
      const i = Math.min(W, Math.max(1, Math.round(q.x/cell+.5))), j = Math.max(1, groundRow(i)-1);
      const puff = Math.min(1.6, sp*0.5);
      d[IX(i,j)] += puff*0.9; d[IX(i,j-1)] += puff*0.5;
      const side = q.vx >= 0 ? 1 : -1;
      if (i+1<=W) u[IX(i+1,j)] += puff*0.35*side + puff*0.15;
      if (i-1>=1) u[IX(i-1,j)] -= puff*0.15;
      v[IX(i,j)] -= puff*0.25;
      if (sp > 0.8 && Math.random() < 0.12) spawn(q.x, gy-2, (Math.random()-.5)*4, -Math.random()*3*sp, true);
      grains.splice(k,1);
    }
  }
}
function groundStep(){
  // avalanche: keep slopes under the angle of repose
  const maxd = 1.6;
  for (let it=0; it<3; it++){
    const dir = it%2 ? 1 : -1;
    for (let a=0;a<G-1;a++){
      const k = dir>0 ? a : G-2-a;
      const diff = hgt[k] - hgt[k+1];
      if (diff > maxd){ const m=(diff-maxd)*.5; hgt[k]-=m; hgt[k+1]+=m; }
      else if (diff < -maxd){ const m=(-diff-maxd)*.5; hgt[k]+=m; hgt[k+1]-=m; }
    }
  }
  // wind erosion: strong air near the surface lifts sand
  for (let i=1;i<=W;i++){
    const j = Math.max(1, groundRow(i)-1), n = IX(i,j);
    const s = Math.hypot(u[n], v[n]);
    if (s > 0.55){
      const k = Math.min(G-1, ((i-.5)*cell/GCOL)|0);
      const amt = Math.min(hgt[k]-2, (s-0.55)*1.6);
      if (amt <= 0) continue;
      const span = Math.max(1, Math.round(cell/GCOL));
      for (let q=0;q<span && k+q<G;q++) hgt[k+q] -= amt/span;
      d[n] += amt*0.45; d[n-W-2] += amt*0.2;
      v[n] -= amt*0.05;
      const cnt = amt*1.2;
      for (let c=0;c<cnt;c++) if (Math.random()<cnt-c)
        spawn((i-.5)*cell + (Math.random()-.5)*cell, CH-hgt[k]-3, u[n]*cell*0.8+(Math.random()-.5)*2, v[n]*cell*0.8 - Math.random()*3, Math.random()<.5);
    }
  }
}

// ---------- input ----------
let mode = 'wind', down = false, mx = 0, my = 0, pmx = 0, pmy = 0, gustT = 0;
const setMode = m => { mode = m;
  document.getElementById('mWind').classList.toggle('on', m==='wind');
  document.getElementById('mSand').classList.toggle('on', m==='sand'); };
document.getElementById('mWind').onclick = () => setMode('wind');
document.getElementById('mSand').onclick = () => setMode('sand');
document.getElementById('gust').onclick = () => gustT = 50;
document.getElementById('reset').onclick = init;
cv.addEventListener('pointerdown', e => { down = true; mx = pmx = e.clientX; my = pmy = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
addEventListener('pointerup', () => down = false);
addEventListener('resize', init);

function applyInput(){
  if (down && mode === 'wind'){
    const dx = (mx-pmx)/cell, dy = (my-pmy)/cell;
    const ci = mx/cell+.5, cj = my/cell+.5, r = 4;
    for (let j=Math.max(1,(cj-r)|0); j<=Math.min(H,(cj+r)|0); j++)
      for (let i=Math.max(1,(ci-r)|0); i<=Math.min(W,(ci+r)|0); i++){
        const w = Math.max(0, 1 - Math.hypot(i-ci, j-cj)/r);
        u[IX(i,j)] += dx*0.35*w; v[IX(i,j)] += dy*0.35*w;
      }
  }
  if (down && mode === 'sand'){
    for (let k=0;k<14;k++) spawn(mx + (Math.random()-.5)*14, my + (Math.random()-.5)*6, (Math.random()-.5)*.6, Math.random()*1.5, false);
  }
  pmx = mx; pmy = my;
  if (document.getElementById('auto').checked){
    const t = performance.now()/1000, nx = CW*(0.42 + 0.12*Math.sin(t*0.23));
    for (let k=0;k<10;k++) spawn(nx + (Math.random()-.5)*10, -4, (Math.random()-.5)*.4, 1+Math.random(), false);
  }
  if (gustT > 0){
    gustT--;
    const s = Math.sin(Math.PI * gustT/50);
    for (let j=Math.floor(H*0.45); j<=H; j++) for (let i=1;i<=3;i++) u[IX(i,j)] += 0.9*s;
  }
}

// ---------- render ----------
function render(){
  const sunX = CW*0.68, sunY = CH*0.32;
  // sky
  const sky = ctx.createLinearGradient(0,0,0,CH);
  sky.addColorStop(0,'#1b1522'); sky.addColorStop(.55,'#5a3a2c'); sky.addColorStop(1,'#c78a52');
  ctx.fillStyle = sky; ctx.fillRect(0,0,CW,CH);
  const sun = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,CH*0.7);
  sun.addColorStop(0,'rgba(255,236,200,.95)'); sun.addColorStop(.05,'rgba(255,214,150,.75)');
  sun.addColorStop(.25,'rgba(240,150,80,.25)'); sun.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = sun; ctx.fillRect(0,0,CW,CH);

  // ground
  ctx.beginPath(); ctx.moveTo(0,CH);
  for (let k=0;k<G;k++) ctx.lineTo(k*GCOL, CH-hgt[k]);
  ctx.lineTo(CW,CH); ctx.closePath();
  const gg = ctx.createLinearGradient(0,CH*0.5,0,CH);
  gg.addColorStop(0,'#c99a62'); gg.addColorStop(1,'#5e3f24');
  ctx.fillStyle = gg; ctx.fill();
  ctx.fillStyle = texPat; ctx.fill();
  ctx.strokeStyle = 'rgba(255,230,180,.55)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); for (let k=0;k<G;k++) (k?ctx.lineTo:ctx.moveTo).call(ctx, k*GCOL, CH-hgt[k]+.5); ctx.stroke();

  // grains as tiny motion streaks
  ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  for (let c=0;c<SAND.length;c++){
    const s = SAND[c]; ctx.strokeStyle = `rgb(${s[0]},${s[1]},${s[2]})`;
    ctx.beginPath();
    for (const q of grains) if (q.c===c){ ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx*0.8, q.y - q.vy*0.8 - .6); }
    ctx.stroke();
  }

  // dust: lit by the sun (brighter, warmer near it), soft and blurred
  const D = dimg.data, sgx = sunX/cell, sgy = sunY/cell, sr = (CH*0.35/cell)**2;
  for (let j=1;j<=H;j++) for (let i=1;i<=W;i++){
    const n = IX(i,j), o = ((j-1)*W + (i-1))*4;
    const a = 1 - Math.exp(-d[n]*1.4);
    const L = 1.0 + 0.6*Math.exp(-((i-sgx)**2 + (j-sgy)**2)/sr);
    D[o] = Math.min(255, 236*L); D[o+1] = Math.min(255, 196*L); D[o+2] = Math.min(255, 148*L); D[o+3] = a*215;
  }
  dctx.putImageData(dimg,0,0);
  ctx.save();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.filter = `blur(${Math.max(2, cell*0.6)}px)`;
  ctx.drawImage(dc, 0, 0, W, H, -cell*.5, -cell*.5, CW, H*cell);
  ctx.restore();
}

function loop(){
  applyInput();
  grainStep();
  fluidStep();
  groundStep();
  render();
  requestAnimationFrame(loop);
}
init(); loop();
})();
</script>
</body>
</html>
